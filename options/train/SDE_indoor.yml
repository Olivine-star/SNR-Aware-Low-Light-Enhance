#### general settings
name: SDE_indoor_model
use_tb_logger: true
model: video_base4_m
distortion: sr
scale: 1
gpu_ids: [0]

#### datasets
datasets:
  train:
    name: SDE_indoor_train
    mode: video_samesize_sde
    border_mode: false
    dataroot_LQ: /media/hzho0442/Project/Code/idea/Low-light/dataset/sde/indoor/sde_in_release/train
    dataroot_GT: /media/hzho0442/Project/Code/idea/Low-light/dataset/sde/indoor/sde_in_release/train
    train_size: [352, 272]
    cache_data: true
    padding: new_info

    N_frames: 5
    use_shuffle: true
    n_workers: 8
    batch_size: 8
    GT_size: 256
    LQ_size: 256
    use_flip: true
    use_rot: true
    color: RGB
  val:
    name: SDE_indoor_test
    mode: video_samesize_sde
    dataroot_LQ: /media/hzho0442/Project/Code/idea/Low-light/dataset/sde/indoor/sde_in_release/test
    dataroot_GT: /media/hzho0442/Project/Code/idea/Low-light/dataset/sde/indoor/sde_in_release/test
    train_size: [352, 272]
    cache_data: true
    N_frames: 5
    padding: new_info

#### network structures
network_G:
  which_model_G: low_light_transformer
  nf: 64
  nframes: 5
  groups: 8
  front_RBs: 1
  back_RBs: 1
  predeblur: true
  HR_in: true
  w_TSA: true

#### path
path:
  root: ./
  pretrain_model_G: ~
  strict_load: false

#### training settings: learning rate scheme, loss
train:
  lr_G: !!float 4e-4
  lr_scheme: CosineAnnealingLR_Restart
  beta1: 0.9
  beta2: 0.99
  weight_decay_G: 0
  niter: 200000
  ft_tsa_only: 0
  warmup_iter: -1
  T_period: [200000]
  restarts: [200000]
  restart_weights: [1]
  eta_min: !!float 1e-7

  pixel_criterion: cb
  pixel_weight: 1.0
  val_freq: !!float 5000

#### logger
logger:
  print_freq: 100
  save_checkpoint_freq: !!float 5000
