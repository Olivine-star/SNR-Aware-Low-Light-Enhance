#### general settings
name: SDSD_indoor_model
use_tb_logger: true
model: video_base4_m
distortion: sr
scale: 1
gpu_ids: [0]

#### datasets
datasets:
  train:
    name: SDSD_indoor_train
    mode: video_samesize_sdsd_event
    interval_list: [1]
    random_reverse: false
    border_mode: false
    dataroot_GT: "C:/code/low-light/dataset/sdsd/SDSD_in_event/SDSD_in_2_release/train"
    dataroot_LQ: "C:/code/low-light/dataset/sdsd/SDSD_in_event/SDSD_in_2_release/train"
    train_size: [352, 272]
    cache_keys: ~
    cache_data: true
    padding: new_info

    N_frames: 5     # how many frames as a input.
    use_shuffle: true
    n_workers: 4  # per GPU
    batch_size: 32
    GT_size: 256     # size you want to crop out as input sample.
    LQ_size: 256
    use_flip: true
    use_rot: true
    color: RGB
  val:
    name: SDSD_indoor_test
    mode: video_samesize_sdsd_event
    dataroot_GT: "C:/code/low-light/dataset/sdsd/SDSD_in_event/SDSD_in_2_release/test"
    dataroot_LQ: "C:/code/low-light/dataset/sdsd/SDSD_in_event/SDSD_in_2_release/test"
    cache_data: true
    N_frames: 5
    padding: new_info
    train_size: [352, 272]

#### network structures
network_G:
  which_model_G: low_light_transformer
  nf: 64
  nframes: 5      # must be same as N_frames in dataset.
  groups: 8
  front_RBs: 1
  back_RBs: 1
  predeblur: true     # default false
  HR_in: true       # true if size(input) == size(HR)
  w_TSA: true

#### path
path:
  root: ./
  pretrain_model_G: ~
  strict_load: false

#### training settings: learning rate scheme, loss
train:
  lr_G: !!float 4e-4
  lr_scheme: CosineAnnealingLR_Restart
  beta1: 0.9
  beta2: 0.99
  niter: 200000
  ft_tsa_only: 0
  warmup_iter: -1  # -1: no warm up
  T_period: [200000]
  restarts: [200000]
  restart_weights: [1]
  eta_min: !!float 1e-7

  pixel_criterion: cb
  pixel_weight: 1.0
  val_freq: !!float 5e3

  manual.resize960x512_seed: 0

#### logger
logger:
  print_freq: 100
  save_checkpoint_freq: !!float 5000
